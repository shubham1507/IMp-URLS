# ChaosArmor Deployment

Ansible automation for ChaosArmor frontend deployment.

## Current status

Read-only prerequisite validation:
- SSH connectivity and Python availability
- Connected operating-system account
- Application directory
- Application start and stop scripts

No artifact installation or application restart is implemented yet.

## AAP configuration

- Inventory group: chaosarmor_frontend
- Project branch: main
- Playbook: playbooks/deploy-frontend.yml
- Credential: approved Machine credential for the DEV server

Store credentials in AAP, never in this repository.


   
   

            
